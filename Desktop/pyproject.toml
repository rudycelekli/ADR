[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-desktop"
version = "0.1.0"
description = "Local-first agent insights, file protection, and credential brokering"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "adr-protection==0.1.0",
    "adr-sensor==1.1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "httpx>=0.28", "ruff>=0.11", "pyinstaller>=6.16,<7", "playwright>=1.55,<2",
    "import-linter>=2.1,<3",
]

[project.scripts]
adr-desktop = "adr_desktop.cli:main"

[tool.uv.sources]
adr-protection = { path = "../Protection", editable = true }
adr-sensor = { path = "../Sensor", editable = true }

[tool.setuptools.packages.find]
include = ["adr_desktop*"]

[tool.setuptools.package-data]
adr_desktop = ["web/*", "native/*.c", "bin/*", "adapters/*.js", "plugins/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.importlinter]
root_packages = ["adr_desktop", "adr_sensor", "adr_discovery", "adr_protection"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Sensor, Discovery and Protection do not import Desktop"
type = "forbidden"
source_modules = ["adr_sensor", "adr_discovery", "adr_protection"]
forbidden_modules = ["adr_desktop"]

[[tool.importlinter.contracts]]
name = "Sensor, Discovery and Protection do not import each other"
type = "independence"
modules = ["adr_sensor", "adr_discovery", "adr_protection"]

[[tool.importlinter.contracts]]
name = "Desktop uses Sensor and Discovery only through their api modules"
type = "forbidden"
source_modules = ["adr_desktop"]
forbidden_modules = ["adr_sensor", "adr_discovery"]
ignore_imports = ["adr_desktop.** -> adr_sensor.api", "adr_desktop.** -> adr_discovery.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The hook does not import the server, runtime, API, review code or Discovery"
type = "forbidden"
source_modules = ["adr_desktop.hooks", "adr_desktop.prompt_guard"]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "starlette",
    "adr_desktop.runtime",
    "adr_desktop.api",
    "adr_desktop.review_process",
    "adr_desktop.review_quota",
    "adr_desktop.review_supervisor",
    "adr_desktop.review_usage",
    "adr_desktop.security_reviews",
    "adr_discovery",
]

[[tool.importlinter.contracts]]
name = "Hooks, agent plugins, MCP trust and artifact identity get agent facts from integrations.agents, with no cycle"
type = "layers"
layers = [
    "adr_desktop.agent_plugins",
    "adr_desktop.hooks",
    "adr_desktop.mcp_trust : adr_desktop.artifact_identity",
    "adr_desktop.integrations.agents",
]
